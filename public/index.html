<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Video Downloader – Download Video Twitter Full HD</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f8fa; color: #0f1419; margin: 0; padding: 24px 16px 48px; }
    .wrap { max-width: 620px; margin: 0 auto; }
    .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
    h1 { text-align: center; margin: 0 0 4px; font-size: 1.5rem; }
    .sub { text-align: center; color: #536471; margin: 0 0 20px; font-size: .95rem; }
    .form { display: flex; gap: 8px; position: relative; }
    .input-group { flex: 1; position: relative; display: flex; align-items: center; }
    input[type="url"] { width: 100%; padding: 12px 45px 12px 14px; font-size: 1rem; border: 2px solid #cfd9de; border-radius: 999px; outline: none; }
    input[type="url"]:focus { border-color: #1d9bf0; }
    .clear-btn { position: absolute; right: 14px; background: #eff3f4; border: none; border-radius: 50%; width: 24px; height: 24px; display: none; align-items: center; justify-content: center; cursor: pointer; color: #536471; font-size: 14px; font-weight: bold; transition: background 0.2s; }
    .clear-btn:hover { background: #e7e7e8; color: #0f1419; }
    button#fetchBtn { padding: 12px 20px; font-size: 1rem; font-weight: 700; cursor: pointer; background: #1d9bf0; color: #fff; border: 0; border-radius: 999px; white-space: nowrap; }
    button:hover { background: #1a8cd8; }
    button:disabled { opacity: .6; cursor: wait; }
    .hint { font-size: .85rem; color: #536471; margin-top: 10px; text-align: center; }
    .hint code { background: #eff3f4; padding: 2px 6px; border-radius: 6px; }
    #status { margin-top: 14px; text-align: center; }
    .error { color: #f4212e; background: #fde8e9; padding: 10px 14px; border-radius: 10px; }
    .loading { color: #536471; }
    .result { margin-top: 18px; border-top: 1px solid #eff3f4; padding-top: 18px; }
    video, .thumb { width: 100%; border-radius: 12px; background: #000; display: block; }
    .meta { margin: 12px 0; font-size: .95rem; }
    .meta .user { font-weight: 700; }
    .meta .text { color: #0f1419; white-space: pre-wrap; word-break: break-word; }
    .q-title { font-weight: 700; margin: 14px 0 12px; font-size: 1rem; }
    .quality-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .quality-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 12px; border: 2px solid #eff3f4; border-radius: 12px; background: #fff; cursor: pointer; transition: all 0.2s ease; text-align: center; }
    .quality-card:hover { border-color: #1d9bf0; background: #f0f9ff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(29, 155, 240, 0.1); }
    .quality-card.best { border-color: #1d9bf0; background: #f0f9ff; }
    .quality-resolution { font-size: 1.25rem; font-weight: 700; color: #0f1419; }
    .quality-label { font-size: 0.85rem; color: #536471; }
    .quality-badge { font-size: 0.7rem; font-weight: 700; background: #1d9bf0; color: #fff; padding: 3px 8px; border-radius: 999px; }
    .quality-badge.hd { background: #00ba7c; }
    .quality-badge.full-hd { background: #f91880; }
    .quality-card a { padding: 8px 12px; font-size: 0.9rem; text-decoration: none; background: #1d9bf0; color: #fff; border-radius: 8px; font-weight: 600; display: inline-block; width: 100%; transition: background 0.2s; }
    .quality-card a:hover { background: #1a8cd8; }
    .quality-card a.downloading { background: #536471; cursor: wait; position: relative; }
    .quality-card a.downloading::after { content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 8px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #0f1419; color: #fff; padding: 12px 18px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.2); display: none; align-items: center; gap: 10px; z-index: 1000; animation: slideIn 0.3s ease; }
    .toast.show { display: flex; }
    .toast.success { background: #00ba7c; }
    .toast.error { background: #f4212e; }
    .toast-icon { font-size: 1.2rem; }
    .toast-message { font-size: 0.9rem; }
    @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .steps { margin-top: 20px; font-size: .9rem; color: #536471; }
    .steps ol { padding-left: 20px; margin: 8px 0 0; }
    .steps li { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>Twitter Video Downloader</h1>
  <div class="form">
    <div class="input-group">
      <input type="url" id="tweetUrl" placeholder="Masukkan URL tweet (X) yang berisi video" />
      <button type="button" id="clearBtn" class="clear-btn" title="Hapus">✕</button>
    </div>
    <button id="fetchBtn">Ambil Video</button>
  </div>
  <div id="status"></div>
  <div class="toast" id="toast">
    <span class="toast-icon" id="toastIcon">⏳</span>
    <span class="toast-message" id="toastMessage"></span>
  </div>
  <div class="result" id="result" style="display:none;">
    <img id="thumb" class="thumb" src="" alt="Thumbnail" />
    <p><strong>Pengguna:</strong> <span id="user"></span></p>
    <p id="text"></p>
    <h3 class="q-title">Pilih Kualitas Video:</h3>
    <div class="quality-grid" id="qualityGrid"></div>
  </div>
  <script>
    const fetchBtn = document.getElementById('fetchBtn');
    const clearBtn = document.getElementById('clearBtn');
    const tweetUrl = document.getElementById('tweetUrl');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const thumbImg = document.getElementById('thumb');
    const userSpan = document.getElementById('user');
    const textP = document.getElementById('text');
    const qualityGrid = document.getElementById('qualityGrid');
    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toastIcon');
    const toastMessage = document.getElementById('toastMessage');

    function showToast(message, type = 'info') {
      toastMessage.textContent = message;
      toastIcon.textContent = type === 'success' ? '✓' : type === 'error' ? '✕' : '⏳';
      toast.className = `toast show ${type}`;
      if (type !== 'info') {
        setTimeout(() => toast.classList.remove('show'), 3000);
      }
    }

    // Show/hide clear button based on input
    tweetUrl.addEventListener('input', () => {
      clearBtn.style.display = tweetUrl.value ? 'flex' : 'none';
    });

    // Clear input logic
    clearBtn.addEventListener('click', () => {
      tweetUrl.value = '';
      clearBtn.style.display = 'none';
      tweetUrl.focus();
    });

    function showError(msg) {
          statusDiv.innerHTML = `<p class="error">⚠ ${msg}</p>`;
    }

    fetchBtn.addEventListener('click', async () => {
      const url = tweetUrl.value.trim();
      if (!url) { showError('URL tidak boleh kosong'); return; }
      statusDiv.textContent = 'Mengambil info video...';
      resultDiv.style.display = 'none';
      qualityGrid.innerHTML = '';
      try {
        const resp = await fetch('/api/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Gagal');
        // Populate UI
        thumbImg.src = data.thumb || '';
        userSpan.textContent = data.user || '';
        textP.textContent = data.text || '';
        // Build download links
        data.videos.forEach((v, idx) => {
          v.variants.forEach(vr => {
            const card = document.createElement('div');
            card.className = 'quality-card';
            if (vr.label.toLowerCase().includes('full hd') || vr.label.toLowerCase().includes('1080')) {
              card.classList.add('best');
            }
            const res = document.createElement('div');
            res.className = 'quality-resolution';
            res.textContent = vr.label;
            const link = document.createElement('a');
            link.href = `/api/download?url=${encodeURIComponent(vr.url)}&filename=${encodeURIComponent(`twitter-${data.id}-${vr.label.replace(/\s+/g,'_')}.mp4`)}`;
            link.textContent = 'Unduh';
            link.target = '_blank';
            const badge = document.createElement('span');
            badge.className = 'quality-badge';
            if (vr.label.toLowerCase().includes('full hd')) badge.textContent = 'Full HD';
            else if (vr.label.toLowerCase().includes('hd')) badge.textContent = 'HD';
            else if (vr.label.toLowerCase().includes('sd')) badge.textContent = 'SD';
            else badge.textContent = 'Video';
            card.appendChild(res);
            card.appendChild(badge);
            card.appendChild(link);
            qualityGrid.appendChild(card);

            // Track download progress
            link.addEventListener('click', (e) => {
              const btn = e.target;
              const originalText = btn.textContent;
              btn.textContent = 'Sedang mengunduh...';
              btn.classList.add('downloading');
              btn.style.pointerEvents = 'none';

              // Show toast notification
              showToast(`Memulai download ${vr.label}...`, 'info');

              // When download completes (fallback after timeout)
              setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('downloading');
                btn.style.pointerEvents = 'auto';
                showToast(`Download ${vr.label} selesai!`, 'success');
              }, 8000); // Fallback after 8 seconds

              // Reset when page loses focus (download started in new tab)
              window.addEventListener('blur', function resetOnBlur() {
                btn.textContent = originalText;
                btn.classList.remove('downloading');
                btn.style.pointerEvents = 'auto';
                window.removeEventListener('blur', resetOnBlur);
                showToast(`Download ${vr.label} dimulai!`, 'success');
              }, { once: true });
            });
          });
        });
        resultDiv.style.display = 'block';
        statusDiv.textContent = '';
      } catch (e) {
        showError('Error: ' + e.message);
      }
    });
  </script>
</body>
</html>
